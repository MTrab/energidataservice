name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest (${{ matrix.pytest }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pytest: [pinned, "9.2.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install candidate pytest
        if: matrix.pytest != 'pinned'
        env:
          PYTEST_VERSION: ${{ matrix.pytest }}
        run: python -m pip install "pytest==$PYTEST_VERSION"
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q tests
